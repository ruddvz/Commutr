      <stop offset="0%" stop-color="#1a7f45"/>
      <stop offset="100%" stop-color="#30C263"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30C263"/>
