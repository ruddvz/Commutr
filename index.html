<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>COMMUTR — Canada's Fee-Free Carpooling</title>
    <meta
      name="description"
      content="Find intercity carpooling rides across Canada. Zero booking fees, direct driver chat, and cost-sharing coordination."
    />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#1f7a4d" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="COMMUTR" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="COMMUTR — Canada's Fee-Free Carpooling" />
    <meta
      property="og:description"
      content="Find intercity carpooling rides across Canada. Zero booking fees, direct driver chat, and cost-sharing coordination."
    />
    <meta property="og:image" content="icons/icon-512.svg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />

    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <div id="app" class="cm-app-shell">
      <header id="appTopBar" class="cm-topbar"></header>
      <main id="appScreen" class="cm-screen" tabindex="-1"></main>
      <nav id="appBottomNav" class="cm-bottom-nav" aria-label="Primary"></nav>
    </div>
    <div id="sheetRoot"></div>
    <div id="toastRoot">
      <div id="toast" class="cm-toast" role="status" aria-live="polite"></div>
    </div>
    <div id="modalRoot"></div>
  </body>
</html>
