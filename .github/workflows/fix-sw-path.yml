name: Fix SW Path (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sw-path.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix service worker registration path
        run: |
          sed -i "s|navigator.serviceWorker.register('/sw.js')|navigator.serviceWorker.register('sw.js')|g" index.html
          echo "After fix:"
          grep "serviceWorker.register" index.html

      - name: Commit fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sw-path.yml
          git add index.html
          git commit -m "fix: relative sw.js path + remove one-shot workflow

Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
